name: RadControl CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: RadControl verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend contracts and build
        run: |
          npm run verify:security
          npm run verify:governance
          npm run verify:document-transport
          npm run verify:portfolio-blueprint
          npm run verify:o2-contract
          npm run verify:project-builder
          npm run test:formation-payload
          npm run verify:formation-learning
          npm run verify:ci-contract
          npm run verify:repo-index
          npm run verify:agents-architecture
          npm run verify:governed-notes
          npm run verify:infrastructure-architecture
          npm run verify:projects-architecture
          npm run verify:tauri-e2e-contract
          npm run verify:production-delivery
          npm run test:empire-todo
          npm run verify:empire-todo
          npm run test:sentinel
          npm run verify:sentinel
          npm run test:content-preservation
          npm run verify:content-preservation
          python3 -B -m unittest tests/release_candidate_evidence_test.py -v
          npm run lint
          npm run build
          npm audit --omit=dev
          bash scripts/snapshot_repo_state.sh --check
          bash scripts/snapshot_repo_state.sh --verify-idempotence
      - name: Run Rust checks
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
